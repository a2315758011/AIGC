name: Storyboard Regression

on:
  pull_request:
    paths:
      - "剧本转分镜指令"
      - "剧本转分镜自检指令"
      - "分镜规则清单.json"
      - "AGENTS.md"
      - "skills/storyboard-director-cn/references/**"
      - "skills/storyboard-director-cn/SKILL.md"
      - "skills/storyboard-director-cn/README.md"
      - "skills/storyboard-director-cn/scripts/**"
      - "skills/storyboard-director-cn/tests/**"
      - "skills/storyboard-director-cn/SOURCE_LOCK.json"
      - ".github/workflows/storyboard-regression.yml"
  push:
    branches:
      - "main"
      - "fix/storyboard-parallel-regression-ci-20261028"
    paths:
      - "剧本转分镜指令"
      - "剧本转分镜自检指令"
      - "分镜规则清单.json"
      - "AGENTS.md"
      - "skills/storyboard-director-cn/references/**"
      - "skills/storyboard-director-cn/SKILL.md"
      - "skills/storyboard-director-cn/README.md"
      - "skills/storyboard-director-cn/scripts/**"
      - "skills/storyboard-director-cn/tests/**"
      - "skills/storyboard-director-cn/SOURCE_LOCK.json"
      - ".github/workflows/storyboard-regression.yml"

permissions:
  contents: read

jobs:
  storyboard-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Facial performance continuity contract
        run: node skills/storyboard-director-cn/scripts/verify-performance-continuity-contract.cjs
      - name: Facial performance preflight regression
        run: node skills/storyboard-director-cn/scripts/validate-facial-performance-continuity.cjs skills/storyboard-director-cn/tests/面部表演连续性回归样例-V1.json
      - name: SCG regression
        run: node skills/storyboard-director-cn/scripts/分镜SCG校验器-V1.js skills/storyboard-director-cn/tests/分镜SCG回归样例-V1.json
      - name: Build and verify offline Skill ZIP
        run: node skills/storyboard-director-cn/scripts/package-offline-skill-regression.cjs --output "${RUNNER_TEMP}/storyboard-director-cn-1.3.7.zip"
      - name: Upload verified offline Skill ZIP
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-director-cn-v1.3.7
          path: ${{ runner.temp }}/storyboard-director-cn-1.3.7.zip
          if-no-files-found: error
          retention-days: 30
      - name: Event-time regression
        run: node skills/storyboard-director-cn/scripts/分镜事件时长校验器-V1.js skills/storyboard-director-cn/tests/分镜事件时长回归样例-V1.json
