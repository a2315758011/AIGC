name: video-director-regression

on:
  push:
    branches:
      - "main"
    paths:
      - "AGENTS.md"
      - "README.md"
      - "skills/README.md"
      - "skills/video-director-cn/**"
      - "docs/代码动画与程序化视频制作规范-V1.md"
      - "docs/知识体系/**"
      - "docs/Deepresearch/2026-11-03_video-director程序化视频工作流审查与采纳.md"
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "skills/README.md"
      - "skills/video-director-cn/**"
      - "docs/代码动画与程序化视频制作规范-V1.md"
      - "docs/知识体系/**"
      - "docs/Deepresearch/2026-11-03_video-director程序化视频工作流审查与采纳.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact skill package and SHA-256 manifest
        run: python skills/video-director-cn/scripts/verify_manifest.py

      - name: Build fresh manifest-driven staging and verify extracted ZIP
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          source = Path("skills/video-director-cn").resolve()
          manifest_path = source / "artifact-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          workspace = Path(os.environ["RUNNER_TEMP"]) / (
              "video-director-package-" + os.environ["GITHUB_RUN_ID"] + "-" +
              os.environ["GITHUB_RUN_ATTEMPT"]
          )
          if workspace.exists():
              raise SystemExit("FAIL: task-specific package workspace already exists")
          workspace.mkdir(parents=True)
          staging = workspace / "staging"
          archive = workspace / "video-director-cn.zip"
          extracted = workspace / "extracted"
          staging.mkdir()
          extracted.mkdir()

          expected = set()
          for item in manifest["files"]:
              rel = PurePosixPath(item["path"])
              if rel.is_absolute() or ".." in rel.parts or not rel.parts:
                  raise SystemExit("FAIL: unsafe manifest path: " + item["path"])
              key = rel.as_posix()
              if key in expected:
                  raise SystemExit("FAIL: duplicate manifest path: " + key)
              expected.add(key)
              src = source.joinpath(*rel.parts)
              if not src.is_file() or src.is_symlink():
                  raise SystemExit("FAIL: missing or symlink source: " + key)
              dst = staging.joinpath(*rel.parts)
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          shutil.copy2(manifest_path, staging / "artifact-manifest.json")
          verifier = staging / "scripts" / "verify_manifest.py"
          subprocess.run(
              [sys.executable, str(verifier), str(staging / "artifact-manifest.json")],
              check=True,
          )

          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for file in sorted(p for p in staging.rglob("*") if p.is_file()):
                  zf.write(file, file.relative_to(staging).as_posix())
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              names = set(zf.namelist())
              expected_zip = expected | {"artifact-manifest.json"}
              if bad:
                  raise SystemExit("FAIL: ZIP CRC error: " + bad)
              if names != expected_zip:
                  raise SystemExit(
                      "FAIL: ZIP file set mismatch; missing=" +
                      repr(sorted(expected_zip - names)) + "; extra=" +
                      repr(sorted(names - expected_zip))
                  )
              zf.extractall(extracted)

          subprocess.run(
              [sys.executable, str(extracted / "scripts" / "verify_manifest.py"),
               str(extracted / "artifact-manifest.json")],
              check=True,
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("VIDEO_DIRECTOR_PACKAGE_ROOT=" + str(extracted) + "\n")
          print("PASS: manifest-driven fresh staging, ZIP file set, CRC and extracted SHA-256")
          print("PACKAGE_FILES=" + str(len(expected) + 1))

          PY

      - name: Compile Python scripts from extracted package
        run: python -m py_compile "$VIDEO_DIRECTOR_PACKAGE_ROOT"/scripts/*.py

      - name: Run adapter and timeline regression from extracted package
        run: python -m unittest discover -s "$VIDEO_DIRECTOR_PACKAGE_ROOT/tests" -p "test_*.py" -v

      - name: Install QA dependencies
        run: python -m pip install -r "$VIDEO_DIRECTOR_PACKAGE_ROOT/requirements-qa.txt"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render synthetic MP4 and run upstream QA smoke test
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/video-director"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=1280x720:rate=24:duration=4" \
            -pix_fmt yuv420p "$RUNNER_TEMP/video-director/smoke.mp4"
          python skills/video-director-cn/scripts/qa_video.py \
            "$RUNNER_TEMP/video-director/smoke.mp4" \
            --out "$RUNNER_TEMP/video-director/qa" \
            --times "0.5,1.5,2.5,3.5"
          test -s "$RUNNER_TEMP/video-director/qa/report.json"
          test -s "$RUNNER_TEMP/video-director/qa/report.md"
          test -s "$RUNNER_TEMP/video-director/qa/beats_sheet.jpg"
          test -s "$RUNNER_TEMP/video-director/qa/phone_sheet.jpg"
          test -s "$RUNNER_TEMP/video-director/qa/hook_sheet.jpg"
