name: Comic Production Skill Regression

on:
  push:
    paths:
      - "skills/comic-production-director-cn/**"
      - "docs/漫画专业制作与出版总规范-V1.md"
      - "docs/Deepresearch/2026-11-02_专业漫画制作外部项目与技能研究.md"
      - "docs/Deepresearch/2026-11-02_漫画上色翻译与排字工具第二批.md"
      - "docs/Deepresearch/2026-11-02_MOONKEEP第一话无文字修复与排字工具实物基准测试.md"
      - "docs/Deepresearch/2026-11-02_欧美漫画平台规格与AI商业化规则研究.md"
      - "docs/Deepresearch/2026-11-02_TT_AutoManga源码安全与本地兼容性审查.md"
      - "docs/专业欧美漫画排字与页面阅读规则-V1.md"
      - ".github/workflows/comic-production-skill-regression.yml"
  pull_request:
    paths:
      - "skills/comic-production-director-cn/**"
      - "docs/漫画专业制作与出版总规范-V1.md"
      - "docs/Deepresearch/2026-11-02_专业漫画制作外部项目与技能研究.md"
      - "docs/Deepresearch/2026-11-02_漫画上色翻译与排字工具第二批.md"
      - "docs/Deepresearch/2026-11-02_MOONKEEP第一话无文字修复与排字工具实物基准测试.md"
      - "docs/Deepresearch/2026-11-02_欧美漫画平台规格与AI商业化规则研究.md"
      - "docs/Deepresearch/2026-11-02_TT_AutoManga源码安全与本地兼容性审查.md"
      - "docs/专业欧美漫画排字与页面阅读规则-V1.md"
      - ".github/workflows/comic-production-skill-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill source contract
        run: python skills/comic-production-director-cn/scripts/validate_skill.py
      - name: Run positive and negative contract tests
        run: python -m unittest discover -s skills/comic-production-director-cn/tests -v
      - name: Run comic page QC positive and negative cases
        run: python skills/comic-production-director-cn/tests/validate_qc_cases.py skills/comic-production-director-cn/tests/漫画页面质检正反例-V1.json
